# fly.toml - Fly.io configuration for Warungku API

app = "warungku-api"
primary_region = "sin"  # Singapore - closest to Indonesia

[build]

[env]
  GOLANG_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
